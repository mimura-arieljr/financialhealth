<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinancialHealth · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #05080f;
      --color-ink:     #e1e7ef;
      --color-muted:   #a1a1a1;
      --color-accent:  #00ffff;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>FinancialHealth in production</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="financialhealth-arch-title financialhealth-arch-desc">
      <title id="financialhealth-arch-title">FinancialHealth architecture</title>
      <desc id="financialhealth-arch-desc">Architecture diagram showing a React client reading and writing directly to a Supabase Postgres database and Auth service, and calling a Supabase Edge Function that fetches financial context from the same database before prompting Google's Gemini API.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1a1"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00ffff"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#05080f"/>

      <!-- Zone: Supabase (drawn before arrows and nodes) -->
      <rect x="256" y="96" width="328" height="312" rx="8"
            fill="rgba(225,231,239,0.02)" stroke="rgba(225,231,239,0.10)" stroke-width="0.8"/>
      <rect x="366" y="100" width="72" height="12" rx="2" fill="#05080f"/>
      <text x="402" y="109" fill="rgba(225,231,239,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SUPABASE</text>

      <!-- Arrows first (behind boxes) -->
      <!-- 1: SPA -> Auth -->
      <path d="M 184,244 H 232 Q 240,244 240,236 V 168 Q 240,160 248,160 H 296"
            fill="none" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2: SPA -> DB (primary flow, focal) -->
      <line x1="184" y1="260" x2="296" y2="260" stroke="#00ffff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 3: SPA -> Edge Function -->
      <path d="M 184,276 H 232 Q 240,276 240,284 V 352 Q 240,360 248,360 H 296"
            fill="none" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4: Edge Function -> Auth (token verify, dashed, routed around DB) -->
      <path d="M 544,348 H 556 Q 564,348 564,340 V 168 Q 564,160 556,160 H 544"
            fill="none" stroke="#a1a1a1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 5: Edge Function -> DB (fetch context) -->
      <line x1="420" y1="328" x2="420" y2="292" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 6: Edge Function -> Gemini (external API) -->
      <path d="M 544,372 H 664 Q 672,372 672,364 V 268 Q 672,260 680,260 H 800"
            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="192" y="224" width="32" height="12" rx="2" fill="#05080f"/>
      <text x="208" y="233" fill="#a1a1a1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>

      <rect x="222" y="240" width="36" height="12" rx="2" fill="#05080f"/>
      <text x="240" y="249" fill="#00ffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRUD</text>

      <rect x="192" y="256" width="32" height="12" rx="2" fill="#05080f"/>
      <text x="208" y="265" fill="#a1a1a1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>

      <rect x="572" y="248" width="44" height="12" rx="2" fill="#05080f"/>
      <text x="594" y="257" fill="#a1a1a1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>

      <rect x="428" y="304" width="56" height="12" rx="2" fill="#05080f"/>
      <text x="456" y="313" fill="#a1a1a1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTEXT</text>

      <rect x="680" y="310" width="52" height="12" rx="2" fill="#05080f"/>
      <text x="706" y="319" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT</text>

      <!-- Node: React client -->
      <rect x="40" y="228" width="144" height="64" rx="6" fill="#05080f"/>
      <rect x="40" y="228" width="144" height="64" rx="6" fill="#1a1a1a" stroke="#e1e7ef" stroke-width="1"/>
      <rect x="48" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(225,231,239,0.40)" stroke-width="0.8"/>
      <text x="62" y="245" fill="#e1e7ef" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="112" y="264" fill="#e1e7ef" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React Client</text>
      <text x="112" y="280" fill="#a1a1a1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React 19 · Vite</text>

      <!-- Node: Supabase Auth -->
      <rect x="296" y="128" width="248" height="64" rx="6" fill="#05080f"/>
      <rect x="296" y="128" width="248" height="64" rx="6" fill="#1a1a1a" stroke="#e1e7ef" stroke-width="1"/>
      <rect x="304" y="136" width="32" height="12" rx="2" fill="transparent" stroke="rgba(225,231,239,0.40)" stroke-width="0.8"/>
      <text x="320" y="145" fill="#e1e7ef" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="420" y="164" fill="#e1e7ef" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase Auth</text>
      <text x="420" y="180" fill="#a1a1a1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session · JWT</text>

      <!-- Node: Postgres DB (focal) -->
      <rect x="296" y="228" width="248" height="64" rx="6" fill="#05080f"/>
      <rect x="296" y="228" width="248" height="64" rx="6" fill="rgba(0,255,255,0.10)" stroke="#00ffff" stroke-width="1"/>
      <rect x="304" y="236" width="24" height="12" rx="2" fill="transparent" stroke="rgba(0,255,255,0.50)" stroke-width="0.8"/>
      <text x="316" y="245" fill="#00ffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="420" y="264" fill="#e1e7ef" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
      <text x="420" y="280" fill="#a1a1a1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">expenses · revenues · recurring</text>

      <!-- Node: ai-chat Edge Function -->
      <rect x="296" y="328" width="248" height="64" rx="6" fill="#05080f"/>
      <rect x="296" y="328" width="248" height="64" rx="6" fill="#1a1a1a" stroke="#e1e7ef" stroke-width="1"/>
      <rect x="304" y="336" width="24" height="12" rx="2" fill="transparent" stroke="rgba(225,231,239,0.40)" stroke-width="0.8"/>
      <text x="316" y="345" fill="#e1e7ef" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="420" y="364" fill="#e1e7ef" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ai-chat</text>
      <text x="420" y="380" fill="#a1a1a1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deno edge function</text>

      <!-- Node: Gemini (external) -->
      <rect x="800" y="228" width="144" height="64" rx="6" fill="#05080f"/>
      <rect x="800" y="228" width="144" height="64" rx="6" fill="rgba(225,231,239,0.03)" stroke="rgba(225,231,239,0.30)" stroke-width="1"/>
      <rect x="808" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(225,231,239,0.22)" stroke-width="0.8"/>
      <text x="822" y="245" fill="#b7babc" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="872" y="264" fill="#e1e7ef" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini</text>
      <text x="872" y="280" fill="#a1a1a1" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flash-latest</text>

      <!-- Legend strip -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(225,231,239,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#a1a1a1" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="472" width="14" height="10" rx="2" fill="rgba(0,255,255,0.10)" stroke="#00ffff" stroke-width="1"/>
      <text x="60" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

      <rect x="170" y="472" width="14" height="10" rx="2" fill="#1a1a1a" stroke="#e1e7ef" stroke-width="1"/>
      <text x="190" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

      <rect x="290" y="472" width="14" height="10" rx="2" fill="rgba(225,231,239,0.03)" stroke="rgba(225,231,239,0.30)" stroke-width="1"/>
      <text x="310" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">External</text>

      <line x1="420" y1="477" x2="448" y2="477" stroke="#00ffff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="456" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

      <line x1="580" y1="477" x2="608" y2="477" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="616" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">Internal call</text>

      <line x1="740" y1="477" x2="768" y2="477" stroke="#a1a1a1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="776" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">Auth check</text>

      <line x1="870" y1="477" x2="898" y2="477" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="906" y="480" fill="#a1a1a1" font-size="8.5" font-family="'Geist', sans-serif">External API</text>
    </svg>
  </div>
</body>
</html>
