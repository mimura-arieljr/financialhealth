<?xml version="1.1" encoding="UTF-8" standalone="no"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="394" height="340" viewBox="0 0 200 200" fill="none">
    <defs>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#17bba0" />
            <stop offset="100%" stop-color="#4c75d5" />
        </linearGradient>
        <linearGradient id="plantStem" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#12a7a2" />
            <stop offset="100%" stop-color="#17bba0" />
        </linearGradient>
        <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Flat Shadow -->
    <ellipse cx="100" cy="175" rx="50" ry="8" fill="#000" fill-opacity="0.4" />

    <!-- Growing Sprout with Gold Coin leaves -->
    <!-- Stem -->
    <path d="M100 135 Q100 85, 115 50 Q118 43, 110 38 Q103 45, 102 55" stroke="url(#plantStem)" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Coin Leaves -->
    <!-- Leaf 1 (Left - Gold Coin) -->
    <g transform="translate(73, 75) rotate(-25)">
        <ellipse cx="15" cy="15" rx="15" ry="11" fill="url(#goldCoin)" filter="url(#glowFilter)" />
        <ellipse cx="15" cy="15" rx="10" ry="7" fill="none" stroke="#b45309" stroke-width="1.5" />
    </g>
    <!-- Leaf 2 (Right - Gold Coin) -->
    <g transform="translate(108, 62) rotate(25)">
        <ellipse cx="15" cy="15" rx="15" ry="11" fill="url(#goldCoin)" filter="url(#glowFilter)" />
        <ellipse cx="15" cy="15" rx="10" ry="7" fill="none" stroke="#b45309" stroke-width="1.5" />
    </g>
    <!-- Leaf 3 (Top - Golden Peso Coin) -->
    <g transform="translate(93, 22)">
        <ellipse cx="15" cy="11" rx="15" ry="11" fill="url(#goldCoin)" filter="url(#glowFilter)" />
        <ellipse cx="15" cy="11" rx="11" ry="8" fill="none" stroke="#b45309" stroke-width="1.2" />
        <!-- Tiny Peso symbol on top leaf -->
        <g transform="translate(11, 4) scale(0.45)">
            <path d="M8 4 C 13.5 4, 16 6.5, 16 10 C 16 13.5, 13.5 16, 8 16 L8 28 L4 28 L4 4 L8 4 Z" fill="#b45309" />
            <rect x="1" y="8" width="13" height="3" fill="#b45309" />
        </g>
    </g>

    <!-- Wireframe Box -->
    <!-- Back lines (inside) -->
    <path d="M60 120 L100 142 L140 120" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Front Walls of the Box -->
    <path d="M60 120 L100 142 L100 170 L60 148 Z" fill="rgba(18, 167, 162, 0.08)" stroke="url(#lineGrad)" stroke-width="2" />
    <path d="M100 142 L140 120 L140 148 L100 170 Z" fill="rgba(8, 62, 165, 0.08)" stroke="url(#lineGrad)" stroke-width="2" />

    <!-- Stylized Floating Lid at side -->
    <g transform="translate(-18, 10) rotate(-25, 60, 110)">
        <path d="M30 110 L60 124 L90 110 L60 96 Z" fill="rgba(23, 187, 160, 0.15)" stroke="url(#lineGrad)" stroke-width="1.5" />
    </g>
</svg>
